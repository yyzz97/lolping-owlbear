<!doctype html>
<meta charset="utf-8">
<title>lolPing render fixture</title>
<style>
  body { margin: 24px; color: #eee; background: #253536; font: 16px sans-serif; }
  main { display: flex; align-items: center; gap: 48px; margin-top: 24px; }
  #wheel { width: 344px; height: 344px; }
  #ping-frame { position: relative; width: 200px; height: 128px; }
  #ping-frame img { position: absolute; inset: 0; width: 200px; height: 128px; }
</style>
<label>Signal <select id="signal"></select></label>
<label>Player <input id="player" value="测试玩家 Alice"></label>
<button id="render">Render</button> <output id="status"></output>
<main><img id="wheel" alt="Wheel preview"><div id="ping-frame"><img id="ping" alt="Ping preview"><img id="ping-label" alt="Ping label preview"></div></main>
<script type="module">
  import { DEFAULT_SIGNAL, SIGNALS } from '../src/signals.js';
  import { uiAssetsFor } from '../src/ui-assets.js';
  import { renderPingLabel } from '../src/render-ping.js';
  const ui = uiAssetsFor(new URL('/', location.href));
  const select = document.querySelector('#signal');
  for (const signal of [DEFAULT_SIGNAL, ...SIGNALS]) select.add(new Option(signal.label, signal.id));
  async function render() {
    const signal = [DEFAULT_SIGNAL, ...SIGNALS].find(signal => signal.id === select.value);
    document.querySelector('#wheel').src = ui.wheels[signal.id].url;
    const image = ui.pings[signal.id];
    const ping = document.querySelector('#ping');
    ping.src = image.url;
    const label = document.querySelector('#ping-label');
    label.src = renderPingLabel(image, `${signal.name} · ${document.querySelector('#player').value}`).url;
    await Promise.all([ping.decode(), label.decode()]);
    document.querySelector('#status').textContent = 'PNG + label decoded';
  }
  document.querySelector('#render').onclick = () => void render();
  select.onchange = () => void render();
  void render();
</script>
